name: Bootstrap Playwright to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      playwrightVersion:
        description: Playwright version to mirror
        required: false
        default: "1.53.0"
      targetRepository:
        description: Target owner/repo for GitHub Packages
        required: true
        default: "Rafa081285/QSPlay"

permissions:
  contents: read
  packages: write

jobs:
  mirror-playwright:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: ${{ github.event.inputs.playwrightVersion || '1.53.0' }}
      TARGET_REPOSITORY: ${{ github.event.inputs.targetRepository }}
      PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java for Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: PACKAGES_TOKEN

      - name: Resolve Playwright dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mirror_playwright.py resolve \
            --version "$PLAYWRIGHT_VERSION" \
            --workdir "$GITHUB_WORKSPACE/.playwright-mirror" \
            --repo-local "$GITHUB_WORKSPACE/.playwright-mirror/m2"

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mirror_playwright.py publish \
            --coords-file "$GITHUB_WORKSPACE/.playwright-mirror/coords.txt" \
            --repo-local "$GITHUB_WORKSPACE/.playwright-mirror/m2" \
            --target-url "https://maven.pkg.github.com/${TARGET_REPOSITORY}"
